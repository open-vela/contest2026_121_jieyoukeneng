<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>安聆 VelaGuard · 家属视角</title>
<style>
  :root {
    --bg: #0e1117; --card: #171c26; --line: #262d3a;
    --text: #e8eaf0; --muted: #8b93a5;
    --notice: #2e7d32; --warning: #f9a825; --emergency: #e53935;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 15px/1.6 -apple-system, "PingFang SC", "Noto Sans CJK SC",
          "Microsoft YaHei", sans-serif;
    padding-bottom: 32px;
  }
  header {
    position: sticky; top: 0; z-index: 10; background: #0e1117ee;
    backdrop-filter: blur(8px); border-bottom: 1px solid var(--line);
    padding: 14px 16px calc(14px + env(safe-area-inset-top));
    display: flex; align-items: center; gap: 10px;
  }
  h1 { font-size: 17px; margin: 0; font-weight: 600; }
  .dot { width: 9px; height: 9px; border-radius: 50%; background: #555; }
  .dot.on { background: #35c46b; box-shadow: 0 0 8px #35c46b; }
  .sub { color: var(--muted); font-size: 12px; margin-left: auto; }
  main { padding: 12px 12px 0; max-width: 720px; margin: 0 auto; }
  .empty { color: var(--muted); text-align: center; padding: 48px 16px; }
  .card {
    background: var(--card); border: 1px solid var(--line);
    border-left: 5px solid var(--notice);
    border-radius: 12px; padding: 12px 14px; margin-bottom: 10px;
    animation: pop .25s ease;
  }
  @keyframes pop { from { transform: translateY(-6px); opacity: 0; } }
  .card.warning   { border-left-color: var(--warning); }
  .card.emergency { border-left-color: var(--emergency); }
  .card.emergency.pending { animation: pulse 1.4s infinite; }
  @keyframes pulse { 50% { background: #241419; } }
  .row { display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; }
  .type { font-size: 16px; font-weight: 600; }
  .badge {
    font-size: 12px; padding: 1px 8px; border-radius: 20px;
    background: var(--notice); color: #fff;
  }
  .badge.warning   { background: var(--warning); color: #000; }
  .badge.emergency { background: var(--emergency); }
  .badge.status    { background: #2c3444; color: var(--muted); }
  .time { color: var(--muted); font-size: 12px; margin-left: auto; }
  .summary { margin: 6px 0 4px; }
  .advice {
    margin: 8px 0 4px; padding: 8px 10px; background: #10151d;
    border-radius: 8px; font-size: 14px; color: #cfd6e4;
  }
  .advice b { color: #7fb3ff; font-weight: 600; }
  .meta { color: var(--muted); font-size: 12px; }
  .acts { display: flex; gap: 8px; margin-top: 10px; }
  .command { margin-top: 8px; color: #f4c86b; font-size: 12px; }
  button {
    flex: 1; padding: 9px 0; border-radius: 8px; border: 1px solid var(--line);
    background: #1e2532; color: var(--text); font-size: 14px; cursor: pointer;
  }
  button:active { background: #2a3444; }
  footer {
    color: var(--muted); font-size: 12px; text-align: center;
    padding: 20px 24px; line-height: 1.8;
  }
  .pairing {
    max-width: 720px; margin: 12px auto 0; padding: 0 12px;
  }
  .pairing summary { cursor: pointer; color: #9fb6c9; }
  .pairing form { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr) auto;
    gap: 8px; margin-top: 8px; }
  .pairing input { min-width: 0; padding: 9px; border: 1px solid var(--line);
    border-radius: 8px; background: #171c26; color: var(--text); }
  .pairing button { flex: 0 0 96px; }
  .pairing-actions { display: flex; gap: 8px; margin-top: 8px; }
  .pairing-actions button { flex: 0 0 auto; }
  .pairing-actions button[hidden] { display: none; }
  #pairingMsg { color: var(--muted); font-size: 12px; margin-top: 6px; }
  #pairingHint { color: #9fb6c9; font-size: 12px; margin-top: 6px; }
  @media (max-width: 560px) {
    .pairing form { grid-template-columns: minmax(0, 1fr) auto; }
    .pairing input:first-child { grid-column: 1 / -1; }
    .pairing button { min-width: 88px; }
  }
</style>
</head>
<body>
<header>
  <span class="dot" id="dot"></span>
  <h1>安聆 VelaGuard · 家属视角</h1>
  <span class="sub" id="sub">连接中…</span>
</header>

<section class="pairing">
  <details id="pairingDetails">
    <summary>设备配对（首次使用）</summary>
    <form id="pairingForm">
      <input id="pairingDevice" placeholder="设备编号，例如 velaguard_demo_001" autocomplete="off" spellcheck="false">
      <input id="pairingKey" type="password" placeholder="配对密钥" autocomplete="off" spellcheck="false">
      <button type="submit">配对</button>
    </form>
    <div id="pairingHint"></div>
    <div id="pairingMsg"></div>
  </details>
  <div class="pairing-actions">
    <button id="enableAudio" type="button" hidden>启用提示音</button>
    <button id="logoutPairing" type="button" hidden>解除本机绑定</button>
  </div>
</section>

<main>
  <div id="list"></div>
  <div class="empty" id="empty">暂无事件。设备在本地守护中，只有升级事件才会推送到这里。</div>
</main>

<footer>
  原始录音不出设备，本页只接收结构化事件摘要。<br>
  局域网直连，无公网服务、无账号、无需安装 App。
</footer>

<script>
const TYPE_CN = {
  alarm_beep: '烟雾/燃气报警',
  water_flow: '持续水流',
  impact: '破碎或撞击',
  distress_voice: '呻吟或呼救',
  name_call_help: '呼喊姓名/求救词',
};
const LEVEL_CN = { notice: '提醒', warning: '警告', emergency: '紧急' };
const STATUS_CN = {
  pending: '待处理', handled: '已处理', false_alarm: '误报',
  snoozed: '稍后提醒', no_response: '无人响应',
};
const COMMAND_STATUS_CN = {
  requested: '已请求设备执行', received: '设备已收到', applied: '设备已执行',
  rejected: '设备拒绝执行', requires_local_confirmation: '待本地确认',
  expired: '命令已过期', stale: '命令已过期或版本过旧',
  duplicate: '设备已处理', failed: '设备执行失败',
};

const list = document.getElementById('list');
const empty = document.getElementById('empty');
const dot = document.getElementById('dot');
const sub = document.getElementById('sub');
const pairingDetails = document.getElementById('pairingDetails');
const pairingHint = document.getElementById('pairingHint');
const pairingAudio = document.getElementById('enableAudio');
const pairingLogout = document.getElementById('logoutPairing');
const seen = new Map();
const eventCache = new Map();
const commandRecords = new Map();
const commandStates = new Map();

function fmtTime(iso) {
  if (!iso) return '';
  const d = new Date(iso);
  if (Number.isNaN(d.getTime())) return iso;
  const p = (n) => String(n).padStart(2, '0');
  return `${p(d.getMonth() + 1)}-${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}:${p(d.getSeconds())}`;
}

function render(evt) {
  eventCache.set(evt.eventId, evt);
  let card = seen.get(evt.eventId);
  if (!card) {
    card = document.createElement('div');
    seen.set(evt.eventId, card);
    list.prepend(card);
  }

  const pending = evt.localStatus === 'pending' || evt.localStatus === 'no_response';
  const commandState = commandStates.get(evt.eventId);
  const command = commandRecords.get(evt.eventId);
  const commandInFlight = command &&
    !['rejected', 'failed', 'expired', 'stale'].includes(command.status);
  const canAct = !commandInFlight &&
    ['pending', 'no_response', 'snoozed'].includes(evt.localStatus);
  const typeText = TYPE_CN[evt.eventType] || evt.eventType;
  const levelText = LEVEL_CN[evt.level] || evt.level;
  const statusText = STATUS_CN[evt.localStatus] || evt.localStatus;
  card.className = `card ${evt.level}${pending ? ' pending' : ''}`;

  const extra = [];
  if (evt.matchedPhrase) extra.push(`匹配短语「${evt.matchedPhrase}」`);
  if (evt.personLabel) extra.push(evt.personLabel);
  if (evt.repeatCount > 1) extra.push(`重复 ${evt.repeatCount} 次`);
  if (evt.night) extra.push('夜间');
  if (!evt.timeReliable) extra.push('设备时间未同步');

  card.innerHTML = `
    <div class="row">
      <span class="type">${escapeHtml(typeText)}</span>
      <span class="badge ${evt.level}">${escapeHtml(levelText)}</span>
      <span class="badge status">${escapeHtml(statusText)}</span>
      <span class="time">${escapeHtml(fmtTime(evt.startedAt))}</span>
    </div>
    <div class="summary">${escapeHtml(evt.summary || '')}</div>
    ${evt.advice ? `<div class="advice"><b>建议</b> ${escapeHtml(evt.advice)}</div>` : ''}
    <div class="meta">
      持续 ${evt.durationSec || 0} 秒 · 置信度 ${((evt.confidence || 0) * 100).toFixed(0)}%
      · ${escapeHtml(evt.deviceId)}${extra.length ? ' · ' + extra.map(escapeHtml).join(' · ') : ''}
    </div>
    ${commandState ? `<div class="command">命令状态：${escapeHtml(commandState)}</div>` : ''}
    ${canAct ? `<div class="acts">
      <button data-id="${escapeHtml(evt.eventId)}" data-rev="${escapeHtml(evt.eventRevision || 1)}" data-st="handled">已联系/已处理</button>
      <button data-id="${escapeHtml(evt.eventId)}" data-rev="${escapeHtml(evt.eventRevision || 1)}" data-st="false_alarm">误报</button>
      <button data-id="${escapeHtml(evt.eventId)}" data-rev="${escapeHtml(evt.eventRevision || 1)}" data-st="snooze">稍后提醒</button>
    </div>` : ''}`;

  empty.style.display = seen.size ? 'none' : '';
}

function updateCommandState(command) {
  if (!command || !command.eventId) return;
  commandRecords.set(command.eventId, command);
  commandStates.set(command.eventId,
    COMMAND_STATUS_CN[command.status] || `命令状态：${command.status}`);
  const evt = eventCache.get(command.eventId);
  if (evt) render(evt);
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, (c) => ({
    '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;',
  })[c]);
}

list.addEventListener('click', async (e) => {
  const btn = e.target.closest('button');
  if (!btn) return;
  btn.disabled = true;
  try {
    const r = await fetch(`/events/${btn.dataset.id}/commands`, {
      method: 'POST',
      credentials: 'same-origin',
      headers: {
        'Content-Type': 'application/json',
        'Idempotency-Key': `phone_${btn.dataset.id}_${btn.dataset.rev}_${btn.dataset.st}`,
      },
      body: JSON.stringify({
        action: btn.dataset.st,
        desiredRevision: Number(btn.dataset.rev),
      }),
    });
    const result = await r.json();
    if (!r.ok) throw new Error(result.error || '命令被拒绝');
    updateCommandState(result.command);
    if (result.event) render(result.event);
  } catch (error) {
    commandRecords.delete(btn.dataset.id);
    commandStates.set(btn.dataset.id, `请求失败：${error.message}`);
    const card = seen.get(btn.dataset.id);
    const evt = eventCache.get(btn.dataset.id);
    if (evt) render(evt);
    if (card) card.querySelectorAll('button').forEach((item) => { item.disabled = false; });
  }
  btn.disabled = false;
});

/* 紧急事件提示音：Web Audio 合成，避免额外资源文件 */
let audioCtx;
let audioReady = false;

async function enableAudio() {
  try {
    audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
    if (audioCtx.resume) await audioCtx.resume();
    audioReady = audioCtx.state === 'running';
    if (!audioReady) throw new Error('浏览器仍未授权');
    pairingAudio.textContent = '提示音已启用';
    pairingAudio.disabled = true;
  } catch (error) {
    pairingAudio.disabled = false;
    document.getElementById('pairingMsg').textContent =
      `提示音未启用：${error.message}`;
  }
}

function beep(level) {
  if (level === 'notice' || !audioReady) return;
  try {
    audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
    const times = level === 'emergency' ? 4 : 2;
    for (let i = 0; i < times; i++) {
      const o = audioCtx.createOscillator();
      const g = audioCtx.createGain();
      o.type = 'square';
      o.frequency.value = level === 'emergency' ? 1180 : 820;
      g.gain.value = 0.08;
      o.connect(g).connect(audioCtx.destination);
      const t = audioCtx.currentTime + i * 0.28;
      o.start(t);
      o.stop(t + 0.16);
    }
  } catch { /* 浏览器未授权音频，忽略 */ }
}

async function bootstrap() {
  try {
    const r = await fetch('/events?limit=100', { credentials: 'same-origin' });
    if (r.status === 401) {
      dot.classList.remove('on');
      sub.textContent = '请先完成配对';
      return false;
    }
    if (!r.ok) throw new Error('事件读取失败');
    const j = await r.json();
    const events = j.events || [];
    events.slice().reverse().forEach(render);
    await loadCommandStates(events);
    return true;
  } catch {
    sub.textContent = '控制台暂不可用';
    return false;
  }
}

async function loadCommandStates(events) {
  await Promise.all(events.map(async (evt) => {
    try {
      const response = await fetch(
        `/events/${encodeURIComponent(evt.eventId)}/commands`,
        { credentials: 'same-origin', cache: 'no-store' });
      if (!response.ok) return;
      const result = await response.json();
      if (result.commands && result.commands[0]) {
        updateCommandState(result.commands[0]);
      }
    } catch { /* 事件本身仍可展示 */ }
  }));
}

function connect() {
  const es = new EventSource('/stream');
  let recovering = false;
  es.addEventListener('hello', () => {
    dot.classList.add('on');
    sub.textContent = '已连接';
  });
  es.addEventListener('event', (m) => {
    const evt = JSON.parse(m.data);
    render(evt);
    beep(evt.level);
    if (navigator.vibrate) navigator.vibrate(evt.level === 'emergency' ? [200, 100, 200] : 120);
  });
  es.addEventListener('update', (m) => render(JSON.parse(m.data)));
  es.addEventListener('command-result', (m) => {
    updateCommandState(JSON.parse(m.data));
  });
  es.onerror = () => {
    dot.classList.remove('on');
    sub.textContent = '连接中断，自动重连中…';
    if (recovering) return;
    recovering = true;
    loadPairingState().then(async (paired) => {
      if (!paired) {
        es.close();
        return;
      }
      /* SSE 断线期间可能漏掉事件；先补历史，再让 EventSource 自动重连。 */
      await bootstrap();
    }).finally(() => { recovering = false; });
  };
}

async function loadPairingState() {
  try {
    const response = await fetch('/pairing', {
      credentials: 'same-origin',
      cache: 'no-store',
    });
    const result = await response.json();
    if (result.deviceId && !document.getElementById('pairingDevice').value) {
      document.getElementById('pairingDevice').value = result.deviceId;
    }
    pairingHint.textContent = result.deviceId
      ? `已识别演示设备 ${result.deviceId}，请输入控制台终端中的配对密钥`
      : '请输入设备编号和控制台管理员提供的配对密钥';
    if (result.paired) {
      pairingDetails.open = false;
      pairingAudio.hidden = false;
      pairingLogout.hidden = false;
      sub.textContent = `已绑定 ${result.pairedDeviceId || ''}`;
      return true;
    }
    pairingDetails.open = true;
    pairingAudio.hidden = true;
    pairingLogout.hidden = true;
    sub.textContent = '请先完成配对';
  } catch {
    pairingHint.textContent = '无法读取配对状态';
    pairingAudio.hidden = true;
    pairingLogout.hidden = true;
  }
  return false;
}

loadPairingState().then((paired) => {
  if (paired) bootstrap().then((ready) => { if (ready) connect(); });
});

pairingAudio.addEventListener('click', enableAudio);

document.getElementById('pairingForm').addEventListener('submit', async (event) => {
  event.preventDefault();
  const msg = document.getElementById('pairingMsg');
  try {
    const response = await fetch('/pairing', {
      method: 'POST',
      credentials: 'same-origin',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        deviceId: document.getElementById('pairingDevice').value.trim(),
        key: document.getElementById('pairingKey').value,
      }),
    });
    const result = await response.json();
    if (!response.ok) throw new Error('密钥错误或设备不匹配');
    document.getElementById('pairingKey').value = '';
    msg.textContent = '配对成功，正在重新连接设备';
    setTimeout(() => window.location.reload(), 250);
  } catch (error) {
    msg.textContent = `配对失败：${error.message}`;
  }
});

pairingLogout.addEventListener('click', async () => {
  const msg = document.getElementById('pairingMsg');
  pairingLogout.disabled = true;
  try {
    const response = await fetch('/pairing', {
      method: 'DELETE',
      credentials: 'same-origin',
      cache: 'no-store',
    });
    if (!response.ok) throw new Error('注销失败');
    window.location.reload();
  } catch (error) {
    pairingLogout.disabled = false;
    msg.textContent = `解除绑定失败：${error.message}`;
  }
});
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>安聆 VelaGuard · 家属视角</title>
<style>
  :root {
    --bg: #0e1117; --card: #171c26; --line: #262d3a;
    --text: #e8eaf0; --muted: #8b93a5;
    --notice: #2e7d32; --warning: #f9a825; --emergency: #e53935;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 15px/1.6 -apple-system, "PingFang SC", "Noto Sans CJK SC",
          "Microsoft YaHei", sans-serif;
    padding-bottom: 32px;
  }
  header {
    position: sticky; top: 0; z-index: 10; background: #0e1117ee;
    backdrop-filter: blur(8px); border-bottom: 1px solid var(--line);
    padding: 14px 16px calc(14px + env(safe-area-inset-top));
    display: flex; align-items: center; gap: 10px;
  }
  h1 { font-size: 17px; margin: 0; font-weight: 600; }
  .dot { width: 9px; height: 9px; border-radius: 50%; background: #555; }
  .dot.on { background: #35c46b; box-shadow: 0 0 8px #35c46b; }
  .sub { color: var(--muted); font-size: 12px; margin-left: auto; }
  main { padding: 12px 12px 0; max-width: 720px; margin: 0 auto; }
  .empty { color: var(--muted); text-align: center; padding: 48px 16px; }
  .card {
    background: var(--card); border: 1px solid var(--line);
    border-left: 5px solid var(--notice);
    border-radius: 12px; padding: 12px 14px; margin-bottom: 10px;
    animation: pop .25s ease;
  }
  @keyframes pop { from { transform: translateY(-6px); opacity: 0; } }
  .card.warning   { border-left-color: var(--warning); }
  .card.emergency { border-left-color: var(--emergency); }
  .card.emergency.pending { animation: pulse 1.4s infinite; }
  @keyframes pulse { 50% { background: #241419; } }
  .row { display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; }
  .type { font-size: 16px; font-weight: 600; }
  .badge {
    font-size: 12px; padding: 1px 8px; border-radius: 20px;
    background: var(--notice); color: #fff;
  }
  .badge.warning   { background: var(--warning); color: #000; }
  .badge.emergency { background: var(--emergency); }
  .badge.status    { background: #2c3444; color: var(--muted); }
  .time { color: var(--muted); font-size: 12px; margin-left: auto; }
  .summary { margin: 6px 0 4px; }
  .advice {
    margin: 8px 0 4px; padding: 8px 10px; background: #10151d;
    border-radius: 8px; font-size: 14px; color: #cfd6e4;
  }
  .advice b { color: #7fb3ff; font-weight: 600; }
  .meta { color: var(--muted); font-size: 12px; }
  .acts { display: flex; gap: 8px; margin-top: 10px; }
  button {
    flex: 1; padding: 9px 0; border-radius: 8px; border: 1px solid var(--line);
    background: #1e2532; color: var(--text); font-size: 14px; cursor: pointer;
  }
  button:active { background: #2a3444; }
  footer {
    color: var(--muted); font-size: 12px; text-align: center;
    padding: 20px 24px; line-height: 1.8;
  }
</style>
</head>
<body>
<header>
  <span class="dot" id="dot"></span>
  <h1>安聆 VelaGuard · 家属视角</h1>
  <span class="sub" id="sub">连接中…</span>
</header>

<main>
  <div id="list"></div>
  <div class="empty" id="empty">暂无事件。设备在本地守护中，只有升级事件才会推送到这里。</div>
</main>

<footer>
  原始录音不出设备，本页只接收结构化事件摘要。<br>
  局域网直连，无公网服务、无账号、无需安装 App。
</footer>

<script>
const TYPE_CN = {
  alarm_beep: '烟雾/燃气报警',
  water_flow: '持续水流',
  impact: '破碎或撞击',
  distress_voice: '呻吟或呼救',
  name_call_help: '呼喊姓名/求救词',
};
const LEVEL_CN = { notice: '提醒', warning: '警告', emergency: '紧急' };
const STATUS_CN = {
  pending: '待处理', handled: '已处理', false_alarm: '误报',
  snoozed: '稍后提醒', no_response: '无人响应',
};

const list = document.getElementById('list');
const empty = document.getElementById('empty');
const dot = document.getElementById('dot');
const sub = document.getElementById('sub');
const seen = new Map();

function fmtTime(iso) {
  if (!iso) return '';
  const d = new Date(iso);
  if (Number.isNaN(d.getTime())) return iso;
  const p = (n) => String(n).padStart(2, '0');
  return `${p(d.getMonth() + 1)}-${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}:${p(d.getSeconds())}`;
}

function render(evt) {
  let card = seen.get(evt.eventId);
  if (!card) {
    card = document.createElement('div');
    seen.set(evt.eventId, card);
    list.prepend(card);
  }

  const pending = evt.localStatus === 'pending' || evt.localStatus === 'no_response';
  card.className = `card ${evt.level}${pending ? ' pending' : ''}`;

  const extra = [];
  if (evt.matchedPhrase) extra.push(`匹配短语「${evt.matchedPhrase}」`);
  if (evt.personLabel) extra.push(evt.personLabel);
  if (evt.repeatCount > 1) extra.push(`重复 ${evt.repeatCount} 次`);
  if (evt.night) extra.push('夜间');
  if (!evt.timeReliable) extra.push('设备时间未同步');

  card.innerHTML = `
    <div class="row">
      <span class="type">${TYPE_CN[evt.eventType] || evt.eventType}</span>
      <span class="badge ${evt.level}">${LEVEL_CN[evt.level] || evt.level}</span>
      <span class="badge status">${STATUS_CN[evt.localStatus] || evt.localStatus}</span>
      <span class="time">${fmtTime(evt.startedAt)}</span>
    </div>
    <div class="summary">${escapeHtml(evt.summary || '')}</div>
    ${evt.advice ? `<div class="advice"><b>建议</b> ${escapeHtml(evt.advice)}</div>` : ''}
    <div class="meta">
      持续 ${evt.durationSec || 0} 秒 · 置信度 ${((evt.confidence || 0) * 100).toFixed(0)}%
      · ${evt.deviceId}${extra.length ? ' · ' + extra.join(' · ') : ''}
    </div>
    <div class="acts">
      <button data-id="${evt.eventId}" data-st="handled">已联系/已处理</button>
      <button data-id="${evt.eventId}" data-st="false_alarm">误报</button>
    </div>`;

  empty.style.display = seen.size ? 'none' : '';
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, (c) => ({
    '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;',
  })[c]);
}

list.addEventListener('click', async (e) => {
  const btn = e.target.closest('button');
  if (!btn) return;
  btn.disabled = true;
  await fetch(`/events/${btn.dataset.id}`, {
    method: 'PATCH',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ localStatus: btn.dataset.st }),
  }).catch(() => {});
  btn.disabled = false;
});

/* 紧急事件提示音：Web Audio 合成，避免额外资源文件 */
let audioCtx;
function beep(level) {
  if (level === 'notice') return;
  try {
    audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
    const times = level === 'emergency' ? 4 : 2;
    for (let i = 0; i < times; i++) {
      const o = audioCtx.createOscillator();
      const g = audioCtx.createGain();
      o.type = 'square';
      o.frequency.value = level === 'emergency' ? 1180 : 820;
      g.gain.value = 0.08;
      o.connect(g).connect(audioCtx.destination);
      const t = audioCtx.currentTime + i * 0.28;
      o.start(t);
      o.stop(t + 0.16);
    }
  } catch { /* 浏览器未授权音频，忽略 */ }
}

async function bootstrap() {
  try {
    const r = await fetch('/events?limit=100');
    const j = await r.json();
    (j.events || []).slice().reverse().forEach(render);
  } catch { /* 离线，等 SSE */ }
}

function connect() {
  const es = new EventSource('/stream');
  es.addEventListener('hello', () => {
    dot.classList.add('on');
    sub.textContent = '已连接';
  });
  es.addEventListener('event', (m) => {
    const evt = JSON.parse(m.data);
    render(evt);
    beep(evt.level);
    if (navigator.vibrate) navigator.vibrate(evt.level === 'emergency' ? [200, 100, 200] : 120);
  });
  es.addEventListener('update', (m) => render(JSON.parse(m.data)));
  es.onerror = () => {
    dot.classList.remove('on');
    sub.textContent = '连接中断，自动重连中…';
  };
}

bootstrap().then(connect);
</script>
</body>
</html>
